<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>METEORA 3D — Cristian Rivera</title>
<style>
:root{color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#020812;font-family:Inter,system-ui,Arial;color:#eef7ff}
#app{position:fixed;inset:0}
#globe{position:absolute;inset:0}
header{position:absolute;z-index:5;left:18px;right:18px;top:18px;height:70px;border:1px solid #245174;border-radius:18px;background:rgba(4,18,31,.82);backdrop-filter:blur(14px);display:flex;align-items:center;gap:14px;padding:12px 18px;box-shadow:0 12px 40px #0008}
.logo{font-weight:900;font-size:22px;letter-spacing:.5px}.sub{font-size:12px;color:#8da8bc;margin-top:3px}
.controls{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}.btn{border:1px solid #2b5878;background:#0a2034;color:#eaf7ff;border-radius:11px;padding:10px 13px;font-weight:800;cursor:pointer}.btn:hover{background:#123451}.btn.active{background:#1a91c7;border-color:#5cd9ff}
#loading{position:absolute;z-index:4;inset:0;display:grid;place-items:center;pointer-events:none}
.loader{background:rgba(3,16,28,.88);border:1px solid #285574;border-radius:16px;padding:18px 24px;text-align:center;box-shadow:0 20px 70px #0009}
.spinner{width:30px;height:30px;margin:0 auto 10px;border:3px solid #214762;border-top-color:#54d9ff;border-radius:50%;animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
#status{position:absolute;z-index:5;left:22px;bottom:22px;max-width:min(620px,calc(100vw - 44px));padding:12px 15px;border:1px solid #244d69;border-radius:13px;background:rgba(3,17,29,.82);backdrop-filter:blur(12px);font-size:12px;color:#a9c0d0}
.legend{position:absolute;z-index:5;right:22px;bottom:22px;display:flex;gap:14px;padding:11px 14px;border:1px solid #244d69;border-radius:13px;background:rgba(3,17,29,.82);font-size:12px;color:#aac0d0}.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px}
@media(max-width:700px){header{left:8px;right:8px;top:8px;height:auto;align-items:flex-start}.controls{margin-left:0}.logo{font-size:18px}.sub{display:none}.legend{right:8px;bottom:8px;gap:7px}.btn{padding:8px 9px;font-size:11px}}
</style>
</head>
<body>
<div id="app">
  <div id="globe"></div>
  <header>
    <div><div class="logo">🌍 METEORA 3D</div><div class="sub">Planeta meteorológico · eventos globales · Creado por Cristian Rivera</div></div>
    <div class="controls">
      <button class="btn active" id="rotate">⟳ Auto</button>
      <button class="btn active" id="clouds">☁️ Nubes</button>
      <button class="btn" id="events">🚨 Eventos</button>
      <button class="btn" id="city">📍 Madrid</button>
    </div>
  </header>
  <div id="loading"><div class="loader"><div class="spinner"></div><b>Cargando METEORA 3D…</b><div style="font-size:12px;color:#91a9bb;margin-top:6px">Preparando el planeta</div></div></div>
  <div id="status">Arrastra para girar · rueda para zoom</div>
  <div class="legend">
    <span><i class="dot" style="background:#ff5c78"></i>Alto</span>
    <span><i class="dot" style="background:#ffad55"></i>Medio</span>
    <span><i class="dot" style="background:#ffe27a"></i>Precaución</span>
    <span><i class="dot" style="background:#55dfff"></i>METEO</span>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(() => {
  const loading=document.getElementById('loading'), status=document.getElementById('status');
  if(!window.THREE){loading.innerHTML='<div class="loader">⚠️ No se pudo cargar el motor 3D. Comprueba la conexión y recarga.</div>';return;}
  const THREE=window.THREE;
  const root=document.getElementById('globe');
  const scene=new THREE.Scene();
  scene.background=new THREE.Color(0x020812);
  const camera=new THREE.PerspectiveCamera(42,innerWidth/innerHeight,.1,100);
  camera.position.set(0,0,3.25);
  const renderer=new THREE.WebGLRenderer({antialias:true,alpha:false});
  renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));
  renderer.setSize(innerWidth,innerHeight);
  root.appendChild(renderer.domElement);

  scene.add(new THREE.AmbientLight(0x9ecfff,1.0));
  const sun=new THREE.DirectionalLight(0xffffff,2.2);sun.position.set(5,3,5);scene.add(sun);

  const group=new THREE.Group();scene.add(group);

  const loader=new THREE.TextureLoader();
  const earthTex=loader.load(
    'https://threejs.org/examples/textures/planets/earth_atmos_2048.jpg',
    undefined,undefined,
    ()=>status.textContent='No se pudo cargar la textura terrestre. El globo seguirá funcionando.'
  );
  const earth=new THREE.Mesh(
    new THREE.SphereGeometry(1,96,96),
    new THREE.MeshPhongMaterial({map:earthTex,shininess:8})
  );
  group.add(earth);

  const clouds=loader.load('https://threejs.org/examples/textures/planets/earth_clouds_1024.png');
  const cloudMesh=new THREE.Mesh(
    new THREE.SphereGeometry(1.018,96,96),
    new THREE.MeshPhongMaterial({map:clouds,transparent:true,opacity:.55,depthWrite:false})
  );
  group.add(cloudMesh);

  const atmosphere=new THREE.Mesh(
    new THREE.SphereGeometry(1.045,96,96),
    new THREE.MeshBasicMaterial({color:0x4bcfff,transparent:true,opacity:.10,side:THREE.BackSide})
  );
  group.add(atmosphere);

  const eventsGroup=new THREE.Group();group.add(eventsGroup);
  function point(lat,lon,r=1.04){
    const p=lat*Math.PI/180,l=lon*Math.PI/180;
    return new THREE.Vector3(
      r*Math.cos(p)*Math.cos(l),
      r*Math.sin(p),
      -r*Math.cos(p)*Math.sin(l)
    );
  }
  function marker(lat,lon,color,size=.026){
    const m=new THREE.Mesh(new THREE.SphereGeometry(size,12,12),new THREE.MeshBasicMaterial({color}));
    m.position.copy(point(lat,lon));eventsGroup.add(m);
    return m;
  }
  marker(40.4168,-3.7038,0x55dfff,.035);

  let auto=true, showClouds=true, showEvents=false;
  document.getElementById('rotate').onclick=()=>{auto=!auto;document.getElementById('rotate').classList.toggle('active',auto)};
  document.getElementById('clouds').onclick=()=>{showClouds=!showClouds;cloudMesh.visible=showClouds;document.getElementById('clouds').classList.toggle('active',showClouds)};
  document.getElementById('city').onclick=()=>{status.textContent='📍 Madrid · marcador meteorológico';camera.position.set(0,0,2.75)};
  document.getElementById('events').onclick=async()=>{
    showEvents=!showEvents;
    document.getElementById('events').classList.toggle('active',showEvents);
    eventsGroup.visible=showEvents;
    if(showEvents) await loadEvents();
    status.textContent=showEvents?'🚨 Eventos globales activados · GDACS':'Eventos globales ocultos';
  };

  async function loadEvents(){
    try{
      const r=await fetch('/api/events',{cache:'no-store'});
      if(!r.ok) throw new Error();
      const data=await r.json();
      const colors={WF:0xff5c78,FL:0x55dfff,TC:0xffad55,EQ:0xffe27a,VO:0xff6bff,DR:0xc58cff};
      for(const e of (data.events||[]).slice(0,220)){
        if(Number.isFinite(e.lat)&&Number.isFinite(e.lon)) marker(e.lat,e.lon,colors[e.type]||0xffffff,.018);
      }
      status.textContent=`🚨 ${data.events?.length||0} eventos recibidos · GDACS`;
    }catch(e){status.textContent='⚠️ No se pudieron cargar los eventos ahora mismo.'}
  }

  let dragging=false,lastX=0,lastY=0,rx=0,ry=0,dist=3.25;
  renderer.domElement.addEventListener('pointerdown',e=>{dragging=true;lastX=e.clientX;lastY=e.clientY});
  window.addEventListener('pointerup',()=>dragging=false);
  window.addEventListener('pointermove',e=>{
    if(!dragging)return;
    ry+=(e.clientX-lastX)*.006;rx+=(e.clientY-lastY)*.006;rx=Math.max(-1.35,Math.min(1.35,rx));
    lastX=e.clientX;lastY=e.clientY;
  });
  renderer.domElement.addEventListener('wheel',e=>{e.preventDefault();dist=Math.max(1.55,Math.min(6,dist+e.deltaY*.0025))},{passive:false});

  function animate(){
    requestAnimationFrame(animate);
    if(auto) ry+=.0018;
    group.rotation.y=ry;group.rotation.x=rx;
    cloudMesh.rotation.y+=.0005;
    camera.position.z+=(dist-camera.position.z)*.08;
    renderer.render(scene,camera);
  }
  addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
  loading.style.display='none';
  animate();
})();
</script>
</body>
</html>
